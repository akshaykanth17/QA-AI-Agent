<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Login — AI Testing Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1F4E79 0%, #2E75B6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }

    .logo {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 2.5rem;
    }

    h1 {
      text-align: center;
      color: #1F4E79;
      font-size: 1.4rem;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      text-align: center;
      color: #6c757d;
      font-size: 0.85rem;
      margin-bottom: 1.75rem;
    }

    .form-group {
      margin-bottom: 1.1rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.35rem;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border: 1.5px solid #D1D5DB;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus {
      border-color: #2E75B6;
      box-shadow: 0 0 0 3px rgba(46,117,182,0.12);
    }

    .btn-login {
      width: 100%;
      padding: 0.7rem;
      background: linear-gradient(135deg, #1F4E79, #2E75B6);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 0.5rem;
    }

    .btn-login:hover { opacity: 0.88; }

    .error-box {
      background: #FEE2E2;
      border: 1px solid #FCA5A5;
      border-radius: 6px;
      padding: 0.6rem 0.85rem;
      color: #991B1B;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    .demo-hint {
      text-align: center;
      font-size: 0.78rem;
      color: #9CA3AF;
      margin-top: 1.2rem;
    }

    .demo-hint code {
      background: #F3F4F6;
      padding: 1px 5px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🧪</div>
    <h1>Sign In</h1>
    <p class="subtitle">AI Software Testing Agent — Demo App</p>

    {% if error %}
    <div class="error-box" data-testid="error-message" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          data-testid="email-input"
          placeholder="demo@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          data-testid="password-input"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn-login" data-testid="login-button">
        Sign In
      </button>
    </form>

    <p class="demo-hint">
      Demo credentials: <code>demo@example.com</code> / <code>DemoPass@123</code>
    </p>
  </div>
</body>
</html>
